# Argument specs (difftest shapes, no game code) for regenerating Emerald's (BPEE) text printer overrides
# from your own ROM with `anygba decomp` (docs/dev/OVERRIDES.md, "Emerald's text printer"). The overrides
# themselves replay Emerald's code and are not shipped. Addresses below are Emerald's globals
# (pokeemerald.sym): sTextPrinters[31] 0x020206A4, gCurGlyph 0x03002F90, gTextFlags 0x03003014.

# void RunTextPrinters(void): steps the 32 text printers unless text printing is disabled.
# No arguments: the work depends on the global printer table and flag in the loaded state.
[RunTextPrinters]
dead_stack = 24  # push {r4-r7, lr} and push {r8}
tick_limit = 200

[[RunTextPrinters.shape]]
name = "typical"
weight = 10

[[RunTextPrinters.shape]]
name = "low-budget"  # scheduler ticks inside the loop
weight = 2
cycles = { range = [0, 400] }

# u16 RenderFont(struct TextPrinter *textPrinter): runs the font's render function until it stops
# returning 2. The printer is a 0x24-byte struct in RAM; fontId at +5 indexes the ROM font table, so
# buffer bytes are kept small (fontId 0/1, small state fields) to stay on valid font functions.
[RenderFont]
dead_stack = 256  # push {r4, lr} plus the font functions' own frames
tick_limit = 100

[[RenderFont.shape]]
name = "typical"
weight = 10
r0 = { buffer = "ewram", size = [36, 64], bytes = [0, 1], align = 4 }

[[RenderFont.shape]]
name = "iwram-printer"
weight = 3
r0 = { buffer = "iwram", size = [36, 64], bytes = [0, 1], align = 4 }

[[RenderFont.shape]]
name = "zeroed"
weight = 3
r0 = { buffer = "ewram", size = [36, 64], bytes = [0, 0], align = 4 }

[[RenderFont.shape]]
name = "low-budget"
weight = 2
r0 = { buffer = "ewram", size = [36, 64], bytes = [0, 1], align = 4 }
cycles = { range = [0, 400] }

# u16 FontFunc_Normal(struct TextPrinter *printer): first-call font setup, then RenderText.
# Most printers carry bytes >= 7 so RenderText's state (+0x1C) falls to its default case and
# returns at once; bit 7 of +0x15 is random, covering both the init and skip paths.
[FontFunc_Normal]
dead_stack = 256
tick_limit = 50

[[FontFunc_Normal.shape]]
name = "default-state"
weight = 20
r0 = { buffer = "ewram", size = [0x24, 0x24], bytes = [7, 0xFF], align = 4 }

[[FontFunc_Normal.shape]]
name = "default-state-iwram"
weight = 6
r0 = { buffer = "iwram", size = [0x24, 0x24], bytes = [7, 0xFF], align = 4 }

[[FontFunc_Normal.shape]]
name = "low-budget"
weight = 4
r0 = { buffer = "ewram", size = [0x24, 0x24], bytes = [7, 0xFF], align = 4 }
cycles = { range = [0, 60] }

# u16 RenderText(struct TextPrinter *textPrinter): one step of the text printer state machine.
# Small-byte buffers cover the states' control flow; the planted printer (sTextPrinters[31] at
# 0x020206A4, its text at 0x0203FF00) covers characters and escape codes: currentChar points at the
# planted text, window 0 or 1, fonts 0-2, no callback.
[RenderText]
dead_stack = 256
tick_limit = 100

[[RenderText.shape]]
name = "small-fields"
weight = 20
r0 = { buffer = "ewram", size = [40, 64], bytes = [0, 6], align = 4 }

[[RenderText.shape]]
name = "iwram-printer"
weight = 6
r0 = { buffer = "iwram", size = [40, 64], bytes = [0, 6], align = 4 }

[[RenderText.shape]]
name = "low-budget"
weight = 4
r0 = { buffer = "ewram", size = [40, 64], bytes = [0, 6], align = 4 }
cycles = { range = [0, 400] }

[[RenderText.shape]]
name = "random-bytes"  # mostly state > 6: returns 1 at once
weight = 3
r0 = { buffer = "ewram", size = [40, 64], align = 4 }

[[RenderText.shape]]
name = "text-any-state"
weight = 10
r0 = 0x020206a4
memory = [
    { addr = 0x020206A4, bytes = [0, 0] },
