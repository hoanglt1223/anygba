# void DecompressGlyph_Normal(u16 glyphId, bool32 isJapanese): glyph from ROM into gCurGlyph.
[DecompressGlyph_Normal]
dead_stack = 64  # own push of 16 bytes plus DecompressGlyphTile's frame
tick_limit = 50

[[DecompressGlyph_Normal.shape]]
name = "latin"
weight = 12
r0 = { range = [0, 0x1FF] }
r1 = 0

[[DecompressGlyph_Normal.shape]]
name = "japanese"
weight = 8
r0 = { range = [0, 0x1FF] }
r1 = 1

[[DecompressGlyph_Normal.shape]]
name = "other-flag"  # any isJapanese other than 1 takes the latin path
weight = 3
r0 = { range = [0, 0x1FF] }
r1 = "any"

[[DecompressGlyph_Normal.shape]]
name = "high-bits"  # upper half of r0 is discarded by the u16 truncation
weight = 2
r0 = "any"
r1 = { range = [0, 1] }

# void DecompressGlyphTile(const u16 *src, u32 *dest): 8 halfwords in, 8 words out, table lookups only.
[DecompressGlyphTile]
dead_stack = 24  # push {r4-r7, lr} and push {r8}
tick_limit = 10

[[DecompressGlyphTile.shape]]
name = "ram-src"
weight = 20
r0 = { buffer = "ram", size = [16, 16], align = 2 }
r1 = { buffer = "ram", size = [32, 32], align = 4 }

[[DecompressGlyphTile.shape]]
name = "rom-src"
weight = 10
r0 = { pointer = "rom", align = 2 }
r1 = { buffer = "ewram", size = [32, 32], align = 4 }

[[DecompressGlyphTile.shape]]
name = "vram-dest"
weight = 4
r0 = { buffer = "ram", size = [16, 16], align = 2 }
r1 = { pointer = "vram", align = 4 }

[[DecompressGlyphTile.shape]]
name = "overlap"  # dest overlaps src: later source halfwords are overwritten first
weight = 2
r0 = { buffer = "ewram", size = [16, 16], align = 2 }
r1 = { near = "r0", offset = [-16, 8], align = 4 }

[[DecompressGlyphTile.shape]]
name = "low-budget"
weight = 3
r0 = { buffer = "ram", size = [16, 16], align = 2 }
r1 = { buffer = "ram", size = [32, 32], align = 4 }
cycles = { range = [0, 300] }

# void CopyGlyphToWindow(struct TextPrinter *printer): byte +4 window id, +8/+9 pixel x/y in the window.
# The glyph (gCurGlyph at 0x03002F90: 0x40 bytes top half, 0x40 bottom half, width at +0x80, height at
# +0x81) is planted too, so every quadrant case and the clipping at the window edge run.
[CopyGlyphToWindow]
dead_stack = 192
tick_limit = 3000
min_returned = 0.95

[[CopyGlyphToWindow.shape]]
name = "typical"
weight = 10
r0 = { buffer = "ewram", size = [12, 16], bytes = [0, 31], align = 4 }

[[CopyGlyphToWindow.shape]]
name = "any-glyph"
weight = 20
memory = [{ addr = 0x03002F90, size = 0x80 }, { addr = 0x03003010, size = 2, bytes = [0, 16] }]
r0 = { buffer = "ewram", size = [12, 16], bytes = [0, 31], align = 4 }

[[CopyGlyphToWindow.shape]]
name = "any-glyph-near-edge"
weight = 10
memory = [{ addr = 0x03002F90, size = 0x80 }, { addr = 0x03003010, size = 2, bytes = [0, 16] }]
r0 = { buffer = "ewram", size = [12, 16], bytes = [0, 255], align = 4 }

[[CopyGlyphToWindow.shape]]
name = "iwram-printer"
weight = 3
memory = [{ addr = 0x03003010, size = 2, bytes = [0, 16] }]
r0 = { buffer = "iwram", size = [12, 16], bytes = [0, 31], align = 4 }

[[CopyGlyphToWindow.shape]]
name = "low-budget"
weight = 3
memory = [{ addr = 0x03003010, size = 2, bytes = [0, 16] }]
r0 = { buffer = "ewram", size = [12, 16], bytes = [0, 31], align = 4 }
cycles = { range = [0, 400] }

# void ClearTextSpan(struct TextPrinter *printer, u32 width): fills one glyph-high span with the last
# text background colour through FillBitmapRect4Bit. Window id, x and y are small bytes of the printer.
[ClearTextSpan]
dead_stack = 64
tick_limit = 200

[[ClearTextSpan.shape]]
name = "typical"
weight = 20
r0 = { buffer = "ram", size = [12, 16], bytes = [0, 31] }
r1 = { range = [0, 64] }

[[ClearTextSpan.shape]]
name = "wide"
weight = 4
r0 = { buffer = "ram", size = [12, 16], bytes = [0, 31] }
r1 = { range = [0, 255] }

[[ClearTextSpan.shape]]
name = "any-bytes"
weight = 3
r0 = { buffer = "ram", size = [12, 16], bytes = [0, 255] }
r1 = { range = [0, 32] }

[[ClearTextSpan.shape]]
name = "low-budget"
weight = 3
r0 = { buffer = "ram", size = [12, 16], bytes = [0, 31] }
r1 = { range = [0, 64] }
cycles = { range = [0, 400] }

# void TextPrinterDrawDownArrow(struct TextPrinter *printer); gTextFlags (0x03003014) picks the arrow.
[TextPrinterDrawDownArrow]
dead_stack = 64
tick_limit = 50

[[TextPrinterDrawDownArrow.shape]]
name = "delay-countdown"  # byte +0x15 low 5 bits nonzero: only decrements the delay
weight = 10
r0 = { buffer = "ewram", size = [0x24, 0x24], bytes = [1, 0x1F] }

[[TextPrinterDrawDownArrow.shape]]
name = "draw-window0"  # delay 0, window 0, coordinates 0: draws the arrow
weight = 6
r0 = { buffer = "ewram", size = [0x24, 0x24], bytes = [0, 0] }

[[TextPrinterDrawDownArrow.shape]]
name = "draw-any-flags"  # delay 0 with every gTextFlags value: both arrow pictures and the flag 4 skip
weight = 8
r0 = { buffer = "ewram", size = [0x24, 0x24], bytes = [0, 0] }
memory = [{ addr = 0x03003014, size = 1 }]

[[TextPrinterDrawDownArrow.shape]]
name = "iwram-printer"
weight = 3
r0 = { buffer = "iwram", size = [0x24, 0x24], bytes = [1, 0x1F] }

# bool16 TextPrinterWaitWithDownArrow(struct TextPrinter *textPrinter): auto-scroll wait or
# down-arrow draw plus A/B check. The printer is a RAM struct; its window id and arrow fields are
# whatever the random buffer holds, which both versions handle the same way.
[TextPrinterWaitWithDownArrow]
dead_stack = 256  # push {r4, lr} plus the callees' frames
tick_limit = 50

[[TextPrinterWaitWithDownArrow.shape]]
name = "typical"
weight = 10
r0 = { buffer = "ram", size = [32, 64], align = 4 }

[[TextPrinterWaitWithDownArrow.shape]]
name = "small-window-id"  # zeroed-ish printer: low window ids and counters
weight = 6
r0 = { buffer = "ram", size = [32, 64], bytes = [0, 3], align = 4 }

[[TextPrinterWaitWithDownArrow.shape]]
name = "low-budget"  # scheduler ticks inside the function
weight = 3
r0 = { buffer = "ram", size = [32, 64], align = 4 }
cycles = { range = [0, 200] }
