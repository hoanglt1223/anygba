name: pages

# Builds the website (site/), including the compatibility page rendered from compat/*.toml,
# and publishes it with GitHub Pages. The checkpoints themselves are checked by the compat job in ci.yml.
on:
  push:
    branches: [main]
    paths: [site/**, compat/**, tools/compat-site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the website and check its links
        run: python site/build.py --out _site --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
