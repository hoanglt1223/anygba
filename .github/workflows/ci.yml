name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
          - name: windows-clang-cl
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64 -T ClangCL
          - name: linux-gcc
            os: ubuntu-24.04
            configure: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          - name: linux-clang
            os: ubuntu-24.04
            configure: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          - name: macos-arm64
            os: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev

      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Corpus first: the discovery and ROM tests read it.
      - name: Fetch and verify test corpus (sh)
        if: runner.os != 'Windows'
        run: sh tests/fetch-corpus.sh

      - name: Fetch and verify test corpus (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/fetch-corpus.ps1

      - name: Unit tests and headless platform smoke
        run: ctest --test-dir build --build-config Release --output-on-failure
