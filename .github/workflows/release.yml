name: release

# A pushed tag v* builds anygba-recomp and the runtime (libraries, headers, SDL3, CMake
# package) for each host and attaches one archive per host to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
            archive: zip
          - name: linux-x64
            os: ubuntu-24.04
            configure: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
            archive: tar.gz
          - name: macos-arm64
            os: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev

      - name: Configure
        run: cmake -S . -B out ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release -DANYGBA_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build out --config Release --parallel

      - name: Install into the package directory
        shell: bash
        run: |
          pkg="anygba-${GITHUB_REF_NAME}-${{ matrix.name }}"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          cmake --install out --config Release --prefix "dist/$pkg"

      - name: Check the package builds a generated project
        shell: bash
        run: |
          # A tiny ROM made on the spot (b . at the entry): enough to recompile, configure
          # against the package, compile and link.
          printf '\xfe\xff\xff\xea' > smoke.gba
          head -c 252 /dev/zero >> smoke.gba
          "dist/$PKG/bin/anygba-recomp" smoke.gba --output smoke-gen
          cmake -S smoke-gen -B smoke-gen/out ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$PWD/dist/$PKG"
          cmake --build smoke-gen/out --config Release
          # The same through the driver, which also embeds the ROM and packages the program.
          "dist/$PKG/bin/anygba" build smoke.gba -o smoke-dist --name Smoke
          ls smoke-dist

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PKG" -DestinationPath "dist/$env:PKG.zip"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}.${{ matrix.archive }}
          if-no-files-found: error

  # The Android runtime (extract into any host package: it adds android/<abi>/) and the
  # launcher app. Host packages already carry the APK template in share/anygba/android.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Runtime for arm64-v8a and x86_64, and the launcher
        run: |
          cmake -S . -B out/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DANYGBA_BUILD_TESTS=OFF
          cmake --build out/host
          cmake --install out/host --prefix "$PWD/out/prefix"
          cmake -DPREFIX="$PWD/out/prefix" -P platform/android/build-runtime.cmake
          out/prefix/bin/anygba android-launcher -o dist
          mv dist/AnyGBA-Launcher.apk "dist/AnyGBA-Launcher-${GITHUB_REF_NAME}.apk"
          tar -C out/prefix -czf "dist/anygba-${GITHUB_REF_NAME}-android-runtime.tar.gz" android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [package, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create the release and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AnyGBA $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
